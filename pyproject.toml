[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "suspension-sim"
version = "1.0.0"
description = "Production-grade quarter-car suspension dynamics simulator for road-induced vibration analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Vehicle Dynamics Engineering", email = "engineering@example.com" },
]
keywords = ["vehicle-dynamics", "suspension", "quarter-car", "simulation", "numpy", "scipy"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26,<3.0",
  "scipy>=1.11,<2.0",
  "pydantic>=2.7,<3.0",
  "PyYAML>=6.0,<7.0",
  "matplotlib>=3.8,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<2.0",
  "pytest-cov>=5.0,<7.0",
  "mypy>=1.10,<2.0",
  "ruff>=0.5,<1.0",
]
analytics = [
  "pandas>=2.2,<3.0",
]

[project.scripts]
suspension-sim = "suspension_sim.api_or_interface.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/suspension_sim"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
filterwarnings = [
  "error::DeprecationWarning:suspension_sim.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ASYNC240"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
mypy_path = "src"
packages = ["suspension_sim"]
